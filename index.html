<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="telegram-logo-icon-social-media-icon-free-png.webp" type="image/webp">
    <script src="script.js" defer></script>
    <title>Telegram-APP</title>
</head>

<body>
    <div class="container">
        <aside class="sidebar" data-sidebar>
            <div class="container-sections">
                <nav class="container_sections--navigation">
                    <ul class="sections_navigation--list" data-sections-navigation>
                        <li class="navigation_list--items" data-filter="all">Чаты</li>
                        <li class="navigation_list--items" data-filter="channel">Каналы</li>
                        <li class="navigation_list--items" data-filter="bot">Боты</li>
                    </ul>
                </nav>
            </div>

            <div class="container-search">
                <input type="text" class="search-input" data-search-input placeholder="Поиск">
            </div>

            <div class="container-chats" data-container-chats>
            </div>
        </aside>

        <div class="navigation" data-navigation>
            <header class="header" data-header>
                <div class="header_content">
                    <svg class="header_btn" data-header-btn>
                        <use href="arrow_arrows_back_direction_left_navigation_right_icon_123237.svg"></use>
                    </svg>

                    <p class="name" data-name></p>

                    <nav class="header_content--navigation">
                        <ul class="navigation_list">
                            <li class="navigation_list--item">
                                <svg class="icons">
                                    <use href="icon-icons.svg"></use>
                                </svg>
                            </li>
                            <li class="navigation_list--item">
                                <svg class="icons">
                                    <use href="icon-icons (1).svg"></use>
                                </svg>
                            </li>
                            <li class="navigation_list--item">
                                <svg class="icons">
                                    <use href="icon-icons (2).svg"></use>
                                </svg>
                            </li>
                        </ul>
                    </nav>
                </div>
            </header>

            <footer class="footer" data-footer>
                <div class="footer_content">
                    <nav class="footer_content--navigation">
                        <ul class="footer_list">
                            <li class="footer_list--item">
                                <svg class="icons">
                                    <use href="icon-icons (3).svg"></use>
                                </svg>
                            </li>

                            <input type="text" class="footer_list--input" placeholder="Сообщение..." data-input>

                            <li class="footer_list--item">
                                <svg class="icons">
                                    <use href="icon-icons (4).svg"></use>
                                </svg>
                            </li>
                            <li class="footer_list--item">
                                <svg class="icons">
                                    <use href="icon-icons (5).svg"></use>
                                </svg>
                            </li>
                        </ul>
                    </nav>
                </div>
            </footer>
        </div>
    </div>
</body>

</html>
